name: Atlas website

on:
  push:
    branches: [main]
    paths:
      - 'website/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          sparse-checkout: website/public
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
