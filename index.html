<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Atlas Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="boot-splash" id="boot-splash" role="status" aria-label="Загрузка Atlas">
    <div class="boot-brand" aria-hidden="true"><img class="brand-mark boot-mark" src="assets/icon.png" alt=""><span class="boot-name">Atlas</span></div>
    <div class="boot-progress" aria-hidden="true"><span></span></div>
  </div>
  <div class="window-bar">
    <div class="window-caption"><img class="mini-mark" src="assets/icon.png" alt="" width="16" height="16"> Atlas Launcher</div>
    <div class="window-actions"><button data-window="minimize" aria-label="Свернуть"><i data-lucide="minus"></i></button><button data-window="maximize" aria-label="Развернуть"><i data-lucide="square"></i></button><button data-window="close" aria-label="Закрыть"><i data-lucide="x"></i></button></div>
  </div>
  <div class="scene-scrim" aria-hidden="true"></div>
  <div class="app-shell" inert>
    <header class="launcher-toolbar">
      <button class="toolbar-brand" data-page="home" aria-label="Atlas"><img src="assets/icon.png" alt=""><strong>Atlas</strong><span id="atlas-version" data-user-text>1.0.0</span></button>
      <nav class="primary-navigation" aria-label="Основная навигация">
        <button class="nav-item active" data-page="home"><i data-lucide="house"></i>Главная</button>
        <button class="nav-item" data-page="instances"><i data-lucide="layers-2"></i>Мои сборки<span class="nav-count" id="instance-count">1</span></button>
        <button class="nav-item" data-page="workshop"><i data-lucide="braces"></i>Мастерская</button>
        <button class="nav-item" data-page="logs"><i data-lucide="terminal"></i>Журнал запуска</button>
        <button class="nav-item" data-page="settings"><i data-lucide="settings-2"></i>Настройки</button>
      </nav>
      <div class="toolbar-utilities">
        <button class="profile-button" id="profile-button" data-action="account-settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="account-picker" aria-label="Аккаунты" title="Аккаунты"></button>
      </div>
    </header>
    <main>
      <header class="page-header"><div class="header-status"><div id="update-notice" class="update-notice" role="status" aria-live="polite" hidden></div></div></header>
      <div class="content" id="content"></div>
      <div class="instance-dock" role="group" aria-label="Мои сборки"><div id="sidebar-instances" class="sidebar-instances"></div><button class="add-sidebar" data-action="new-instance" aria-label="Добавить сборку"><i data-lucide="plus"></i><span>Добавить сборку</span></button></div>
    </main>
<div class="support-notice" id="support-notice"><button class="support-link" data-action="support-gift" aria-label="Поддержать подарком" title="Поддержать подарком"><i data-lucide="gift"></i><span>Поддержать подарком</span></button><button class="bare" data-action="dismiss-support" aria-label="Скрыть предложение поддержки"><i data-lucide="x"></i></button></div>
  </div>
  <div id="account-picker" popover="auto" role="dialog" aria-label="Аккаунты"><div id="account-picker-content"></div><div id="account-context-menu" class="context-menu" popover="manual" role="menu" aria-label="Действия с аккаунтом"><button type="button" class="context-item" role="menuitem" data-action="picker-remove-account"><i data-lucide="trash-2" aria-hidden="true"></i><span>Удалить аккаунт</span></button></div></div>
  <dialog id="instance-dialog">
    <form id="instance-form">
      <div class="dialog-top"><h2 id="instance-dialog-title">Новая сборка</h2><button class="bare" type="button" data-action="close-dialog" aria-label="Закрыть"><i data-lucide="x"></i></button></div>
      <label class="field">Название<input id="instance-name" name="name" maxlength="48" placeholder="Название сборки" required autocomplete="off"></label>
      <label class="field">Описание <span class="optional">необязательно</span><input name="description" maxlength="140" placeholder="Описание"></label>
      <fieldset class="color-field"><legend>Цвет сборки</legend><div class="color-options" id="instance-colors"></div></fieldset>
      <fieldset class="icon-field"><legend>Значок сборки</legend><div class="icon-options" id="instance-icons"></div></fieldset>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-footer"><button class="button secondary" type="button" data-action="close-dialog">Отмена</button><button class="button primary" type="submit"><i data-lucide="plus"></i>Создать сборку</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <form id="delete-form">
      <div class="dialog-top"><h2 id="delete-title">Удалить сборку?</h2><button class="bare" type="button" data-action="close-delete" aria-label="Закрыть"><i data-lucide="x"></i></button></div>
      <p class="delete-name" id="delete-name" data-user-text></p>
      <p class="subtitle">Миры и настройки сборки, включая дополнительные окна, будут перемещены в корзину.</p>
      <p class="form-error" id="delete-error" role="alert"></p>
      <div class="dialog-footer"><button class="button secondary" type="button" data-action="close-delete">Отмена</button><button class="button danger" type="submit"><i data-lucide="trash-2"></i>В корзину</button></div>
    </form>
  </dialog>
  <dialog id="install-dialog" aria-labelledby="install-title" aria-describedby="install-description">
    <div class="dialog-top"><div class="install-brand"><img src="assets/icon.png" alt="" width="32" height="32"><h2 id="install-title">Файлы игры не установлены</h2></div><button class="bare" type="button" data-action="close-install" aria-label="Закрыть"><i data-lucide="x"></i></button></div>
    <p class="subtitle" id="install-description">Скачивание файлов игры</p>
    <div class="install-status" id="install-status" hidden>
      <div class="install-progress-heading"><strong id="install-stage"></strong><span id="install-progress-value"></span></div>
      <progress id="install-progress" max="100" aria-label="Подготовка игры"></progress>
      <p id="install-detail" class="subtitle"></p>
    </div>
    <p id="install-error" class="form-error" role="alert" hidden></p>
    <div class="install-options"><button type="button" class="button secondary" data-action="import-minecraft"><i data-lucide="folder-open"></i>Выбрать установленный Minecraft</button></div>
    <div class="dialog-footer"><button type="button" class="button secondary" data-action="cancel-install">Отмена</button><button type="button" class="button primary" data-action="start-install"><i data-lucide="download"></i><span id="install-start-label">Скачать и подготовить</span></button></div>
  </dialog>
  <div class="context-menu" id="context-menu" role="menu" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="node_modules/lucide/dist/umd/lucide.js"></script>
  <script src="i18n.js"></script>
  <script src="instance-options.js"></script>
  <script src="app-settings.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
