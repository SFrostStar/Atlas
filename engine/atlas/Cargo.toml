[workspace]
exclude = ["launcher", "crates/atlas-telemetry-server", "crates/atlas-mod-registry", "third_party/wgpu-hal"]
members = [
    "crates/atlas-memory",
    "crates/atlas-core",
    "crates/atlas-dualsense",
    "crates/atlas-threads",
    "crates/atlas-hdr",
    "crates/atlas-world",
    "crates/atlas-client",
    "crates/atlas-client-core",
    "crates/atlas-client-input",
    "crates/atlas-client-render",
    "crates/atlas-command",
    "crates/atlas-items",
    "crates/atlas-server-files",
    "crates/atlas-server",
    "crates/atlas-bots",
    "crates/atlas-assets",
    "crates/atlas-protocol",
    "crates/atlas-theme",
    "crates/atlas-prepare",
    "crates/atlas-telemetry",
    "crates/atlas-bench",
    "crates/atlas-friends",
    "crates/atlas-relay",
    "crates/atlas-mod-sdk",
    "crates/atlas-mods",
    "crates/atlas-mods/tests/guest",
    "crates/atlas-mods/tests/ui_guest",
    "crates/cargo-atlas-mod",
    "crates/atlas-port-pack",
    "crates/atlas-shaders",
    "crates/atlas-shader-api",
    "crates/atlas-release-sign",
    "crates/atlas-mod-sdk/examples/coords-hud",
    "crates/atlas-mod-sdk/examples/predator-missile",
    "crates/atlas-mod-sdk/examples/welcome",
    "crates/atlas-mod-sdk/examples/beacons",
    "mods/official/fps-overlay",
    "mods/official/keystrokes",
    "mods/official/far-view",
    "mods/official/minimap",
    "mods/official/zoom",
    "xtask",
    "mods/official/recipes",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# Drop this and the folder once a wgpu release has both fixes.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
