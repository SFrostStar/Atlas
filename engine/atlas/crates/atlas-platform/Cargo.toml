[package]
name = "atlas-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The platform's public API: what the Atlas layer and mods may use of the engine (docs/layers.md#platform)"

[features]
# Each part of the engine a Atlas crate may reach, so a crate builds only the engine it uses.
# level.dat, servers.dat and region files: NBT, compression, region read and write.
world = ["dep:atlas-world"]
# A server's address after its SRV record, the offline-mode UUID of a name, and servers.dat.
protocol = ["world", "dep:atlas-protocol"]
# Preparing the game's files from the player's own Minecraft install.
prepare = ["dep:atlas-prepare"]
# A server's own files: server.properties, the op, white and ban lists, the user cache.
server-files = ["dep:atlas-server-files"]

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-system = { path = "../atlas-system" }
atlas-bench = { path = "../atlas-bench" }
atlas-perf-format = { path = "../atlas-perf-format" }
atlas-world = { path = "../atlas-world", optional = true }
atlas-protocol = { path = "../atlas-protocol", optional = true }
atlas-prepare = { path = "../atlas-prepare", optional = true }
atlas-server-files = { path = "../atlas-server-files", optional = true }
# The game's extension points, re-exported as `hooks`.
atlas-hooks = { path = "../atlas-hooks" }

[lints]
workspace = true
