[package]
name = "atlas-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Atlas simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
libm = "=0.2.16"

[[bin]]
name = "atlas-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "atlas-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "atlas-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "atlas-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "atlas-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "atlas-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
