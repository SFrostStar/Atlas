[package]
name = "cargo-atlas-mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "cargo atlas-mod new/build/run/check: make Atlas content mods (docs/mods.md)"

# `cargo binstall --git https://github.com/horizon-rust/horizon cargo-atlas-mod` (#2120) reads this: the archive
# `cargo-atlas-mod`'s workflow attaches to the `cargo-atlas-mod-v<version>` release for the runner's target,
# holding the binary at its root. tools/atlas_mod_binstall.py expands it for the workflow's targets.
[package.metadata.binstall]
pkg-url = "https://github.com/horizon-rust/horizon/releases/download/cargo-horizon-mod-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
atlas-mods = { path = "../atlas-mods", default-features = false, features = ["index"] }
serde_json = "1.0.151"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
