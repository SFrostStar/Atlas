[package]
name = "atlas-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
atlas-assets = { path = "../atlas-assets" }
atlas-bench = { path = "../atlas-bench" }
atlas-client-core = { path = "../atlas-client-core" }
atlas-client-input = { path = "../atlas-client-input" }
atlas-command = { path = "../atlas-command" }
atlas-core = { path = "../atlas-core" }
atlas-hdr = { path = "../atlas-hdr" }
atlas-items = { path = "../atlas-items" }
atlas-protocol = { path = "../atlas-protocol" }
atlas-shader-api = { path = "../atlas-shader-api" }
atlas-shaders = { path = "../atlas-shaders" }
atlas-telemetry = { path = "../atlas-telemetry", default-features = false, features = ["live"] }
atlas-theme = { path = "../atlas-theme" }
atlas-threads = { path = "../atlas-threads" }
atlas-world = { path = "../atlas-world" }
ab_glyph = "0.2.32"
bytemuck = { version = "1.24", features = ["derive"] }
# Sound (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
png = "0.18"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10.9"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
junction = "=2.1.0"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Sound output: atlas-client's `audio` feature.
audio = ["dep:cpal"]
# Helpers atlas-client's tests build their fixtures with.
test-support = []

[lints]
workspace = true

[dev-dependencies]
atlas-items = { path = "../atlas-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
